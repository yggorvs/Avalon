name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m avalon --doctor
      - name: Install virtual display for Tk smoke tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
      - name: GUI smoke tests (Linux, real Tk on Xvfb)
        if: runner.os == 'Linux'
        env:
          AVALON_REQUIRE_GUI: '1'
        run: xvfb-run -a python -m unittest discover -s tests -p test_gui.py -v
      - name: GUI smoke tests (Windows, real Tk)
        if: runner.os == 'Windows'
        env:
          AVALON_REQUIRE_GUI: '1'
        run: python -m unittest discover -s tests -p test_gui.py -v

